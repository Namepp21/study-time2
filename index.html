main{max-width:1000px;margin:0 auto;padding:16px}
.card,header,footer{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;border:1px solid var(--line);border-radius:18px;padding:10px 16px}
h1{font-size:1.3rem;margin:0}
.clock{text-align:right}
.clock b{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock span{display:block;color:var(--mute);font-size:.85rem}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel{border:2px solid var(--acc)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tag{background:var(--acc);color:#fff;border-radius:99px;padding:2px 12px;font-size:.8rem;font-weight:500;white-space:nowrap}
.nm{font:inherit;font-size:1.25rem;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--acc2);min-width:0;flex:1;padding:2px 4px}
.timer{text-align:center}
.big{font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--acc)}
.stat{color:var(--mute);font-size:.95rem}
.stat b{color:var(--ink)}
button,input,select{font:inherit;color:var(--ink)}
button{border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--acc,#f28ca5);color:#fff;font-weight:500}
button.ghost{background:var(--acc2,#ffd9e2);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.bar{height:10px;border-radius:99px;background:var(--acc2);overflow:hidden;margin:8px auto;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.goal input{width:70px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav h2{font-size:1rem;margin:0;text-align:center}
.nav button{background:#f28ca5}
.scroll{overflow-x:auto;margin-top:12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:940px}
.day{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:130px}
.day.today{border:2px solid var(--acc);background:var(--acc2)}
.dh{font-weight:600;font-size:.9rem;margin-bottom:6px}
.dh small{color:var(--mute);font-weight:400}
.task{display:flex;gap:6px;align-items:flex-start;font-size:.85rem;background:var(--card);border-radius:10px;padding:5px 7px;margin-bottom:5px}
.task.done span{text-decoration:line-through;color:var(--mute)}
.task em{font-style:normal;color:var(--acc);font-weight:600;display:block;font-size:.75rem}
.task button{background:none;color:var(--mute);padding:0 2px;margin-left:auto}
form{display:flex;gap:8px;flex-wrap:wrap}
form input,form select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
form input[type=text]{flex:1;min-width:160px}
form button{background:#f28ca5}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:8px;border-radius:12px}
</style>
</head>
<body>
<main>
<header>
  <h1> Study Time!! </h1>
  <div class="clock"><b id="clk">--:--:--</b><span id="dt"></span><span>🇹🇭 เวลาประเทศไทย (GMT+7)</span></div>
</header>

<section class="card nav">
  <button id="pv">← ก่อนหน้า</button>
  <h2 id="wk"></h2>
  <button id="nx">ถัดไป →</button>
</section>

<div id="panels"></div>

<section class="card">
  <form id="f">
    <select id="fp" title="ลงช่องของใคร"></select>
    <select id="fd" title="วัน"></select>
    <input type="time" id="ft" value="09:00">
    <input type="text" id="fx" placeholder="จะเรียนอะไรดี เช่น อ่านบทที่ 3" required>
    <button>+ เพิ่มตาราง</button>
  </form>
</section>
<footer>ต้นแบบ · ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ · สู้ ๆ นะ 💪</footer>
</main>
<script>
const TZ='Asia/Bangkok',$=id=>document.getElementById(id);
const DN=['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const todayKey=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
let names=store.get('swm2_names',['ยิ้มหวาน','พีพี']),tasks=store.get('swm2_tasks',null),totals=store.get('swm2_totals',{}),goals=store.get('swm2_goals',[120,120]);
let off=0;const run=[false,false],last=[0,0],sess=[0,0];
function weekKeys(o){const [y,m,d]=todayKey().split('-').map(Number);const b=new Date(Date.UTC(y,m-1,d));const mon=b.getTime()-((b.getUTCDay()+6)%7)*864e5+o*7*864e5;return[...Array(7)].map((_,i)=>new Date(mon+i*864e5).toISOString().slice(0,10))}
if(!tasks){const w=weekKeys(0);tasks=[[0,0,'09:00','อ่านหนังสือบทที่ 1'],[0,1,'10:00','ทบทวนคำศัพท์'],[0,3,'19:00','ติวสอบด้วยกัน 💕'],[1,0,'14:00','ทำแบบฝึกหัด'],[1,2,'09:00','สรุปโน้ต'],[1,3,'19:00','ติวสอบด้วยกัน 💕']].map((t,i)=>({id:i+1,p:t[0],day:w[t[1]],time:t[2],text:t[3],done:false}));store.set('swm2_tasks',tasks)}
const save=()=>store.set('swm2_tasks',tasks);
function build(){
  [0,1].forEach(p=>{
    const s=document.createElement('section');s.className='card panel p'+p;
    s.innerHTML=`<div class="ph"><span class="tag">${p?'ช่องล่าง':'ช่องบน'}</span><input class="nm" id="nm${p}" maxlength="24" aria-label="ชื่อ"></div>
<div class="timer"><div class="stat">กำลังเรียนรอบนี้</div><div class="big" id="big${p}">00:00:00</div>
<div class="row"><button id="go${p}">▶ เริ่มเรียน</button><button class="ghost" id="rs${p}">รีเซ็ตรอบ</button></div>
<div class="stat">วันนี้เรียนไปแล้ว <b id="tm${p}">0</b> นาที</div><div class="bar"><i id="pg${p}"></i></div>
<div class="stat goal">เป้าหมาย <input type="number" id="gl${p}" min="10" step="10"> นาที/วัน · <span id="pc${p}">0%</span></div></div>
<div class="scroll"><div class="week" id="week${p}"></div></div>`;
    $('panels').appendChild(s);
    $('nm'+p).value=names[p];
    $('nm'+p).oninput=e=>{names[p]=e.target.value;store.set('swm2_names',names);people()};
    $('gl'+p).value=goals[p];
    $('gl'+p).onchange=e=>{goals[p]=Math.max(10,+e.target.value||120);store.set('swm2_goals',goals)};
    $('go'+p).onclick=()=>{run[p]=!run[p];if(run[p])last[p]=Date.now();$('go'+p).textContent=run[p]?'⏸ พักก่อน':'▶ เริ่มเรียน'};
    $('rs'+p).onclick=()=>{sess[p]=0;last[p]=Date.now()};
  });
}
function people(){const sel=$('fp'),c=sel.value||'0';sel.innerHTML='';[0,1].forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=(p?'ช่องล่าง: ':'ช่องบน: ')+(names[p]||'ไม่มีชื่อ');sel.appendChild(o)});sel.value=c}
function render(){
  const ks=weekKeys(off),t=todayKey();
  const a=ks[0].split('-'),z=ks[6].split('-');
  $('wk').textContent=`${+a[2]} ${MN[a[1]-1]} – ${+z[2]} ${MN[z[1]-1]}`;
  const sel=$('fd'),cur=sel.value;sel.innerHTML='';
  ks.forEach((k,i)=>{const [,m,d]=k.split('-');const o=document.createElement('option');o.value=k;o.textContent=`${DN[i]} ${+d} ${MN[m-1]}`;sel.appendChild(o)});
  sel.value=ks.includes(cur)?cur:(ks.includes(t)?t:ks[0]);
  [0,1].forEach(p=>{
    const w=$('week'+p);w.innerHTML='';
    ks.forEach((k,i)=>{
      const [,m,d]=k.split('-');
      const el=document.createElement('div');el.className='day'+(k===t?' today':'');
      el.innerHTML=`<div class="dh">${DN[i]} <small>${+d} ${MN[m-1]}</small></div>`;
      tasks.filter(x=>x.p===p&&x.day===k).sort((u,v)=>u.time.localeCompare(v.time)).forEach(x=>{
        const r=document.createElement('div');r.className='task'+(x.done?' done':'');
        const c=document.createElement('input');c.type='checkbox';c.checked=x.done;c.onchange=()=>{x.done=c.checked;save();render()};
        const s=document.createElement('span');const e=document.createElement('em');e.textContent=x.time;s.appendChild(e);s.appendChild(document.createTextNode(x.text));
        const b=document.createElement('button');b.textContent='×';b.onclick=()=>{tasks=tasks.filter(y=>y.id!==x.id);save();render()};
        r.append(c,s,b);el.appendChild(r)});
      w.appendChild(el)});
  });
}
function tick(){
  const n=new Date(),k=todayKey();
  $('clk').textContent=new Intl.DateTimeFormat('th-TH',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n);
  $('dt').textContent=new Intl.DateTimeFormat('th-TH',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(n);
  [0,1].forEach(p=>{
    if(run[p]){const dl=Math.floor((Date.now()-last[p])/1000);if(dl>=1){last[p]+=dl*1000;sess[p]+=dl;totals[p+'|'+k]=(totals[p+'|'+k]||0)+dl;store.set('swm2_totals',totals)}}
    $('big'+p).textContent=fmt(sess[p]);
    const min=Math.floor((totals[p+'|'+k]||0)/60),pc=Math.min(100,Math.round(min/goals[p]*100));
    $('tm'+p).textContent=min;$('pg'+p).style.width=pc+'%';$('pc'+p).textContent=pc+'%';
  });
}
$('pv').onclick=()=>{off--;render()};$('nx').onclick=()=>{off++;render()};
